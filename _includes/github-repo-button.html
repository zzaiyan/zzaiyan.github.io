{%- assign repo_stats = site.data.github_stars[include.repo] -%}
<a class="pub-btn" href="https://github.com/{{ include.repo | escape }}" aria-label="{{ include.repo | escape }} on GitHub{% if repo_stats.stars != nil %}, {{ repo_stats.stars }} stars{% endif %}"{% if repo_stats.stars != nil %} title="{{ repo_stats.stars }} GitHub stars · Updated {{ repo_stats.updated_at | date: '%Y-%m-%d %H:%M UTC' }}"{% endif %}><i class="fab fa-github" aria-hidden="true"></i> GitHub{% if repo_stats.stars != nil %}<span class="github-stars" aria-hidden="true"><svg class="github-stars__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" focusable="false"><path d="M8 1.75 9.93 5.66 14.25 6.29 11.12 9.34 11.86 13.65 8 11.62 4.14 13.65 4.88 9.34 1.75 6.29 6.07 5.66Z"/></svg><span>{{ repo_stats.stars }}</span></span>{% endif %}</a>
