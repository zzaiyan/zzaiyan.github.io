<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="{{ '/images/site/apple-touch-icon.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="{{ '/images/site/favicon-32x32.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="{{ '/images/site/favicon-16x16.png' | relative_url }}"
/>
<link rel="manifest" href="{{ '/images/site/site.webmanifest' | relative_url }}" />

<meta name="msapplication-TileColor" content="#000000" />
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="assets/css/academicons.css" />

{% if page.mathjax %}
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } });
  </script>
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [ ['$','$'], ["\\(","\\)"] ],
        processEscapes: true
      }
    });
  </script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML"
    async
  ></script>
{% endif %}

<!-- end custom head snippets -->
